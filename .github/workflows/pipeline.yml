name: Daily pipeline

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22:00 UTC, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (retry on crash only)
        id: pipeline
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          mkdir -p data
          n=0
          while true; do
            set +e
            python run_pipeline.py
            code=$?
            set -e
            # 0 = clean, 2 = data problems (retrying won't help)
            if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "Failed after 3 attempts"; exit 1; fi
            echo "Attempt $n crashed (exit $code), retrying in 60s"
            sleep 60
          done
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Build dashboard data
        run: |
          python -m src.dashboard.build_metrics
          python -m src.dashboard.export_for_powerbi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exports powerbi/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Email alert
        if: ${{ failure() || steps.pipeline.outputs.exit_code == '2' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          to: ${{ secrets.ALERT_TO }}
          from: Pipeline Alerts <${{ secrets.MAIL_USERNAME }}>
          subject: "fin-data-pipeline: run needs attention"
          body: |
            Exit code: ${{ steps.pipeline.outputs.exit_code || 'crashed (retries exhausted)' }}  (2 = data problems)
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Mark run as failed if data problems found
        if: ${{ steps.pipeline.outputs.exit_code == '2' }}
        run: exit 1